
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CurrencyFlow | Currency Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">💱 CurrencyFlow</div>
            <p class="tagline">Your money, across the world.</p>
        </header>

        <main class="converter-card">
            <div class="card-heading">
                <span class="small-label">SMART CURRENCY EXCHANGE</span>
                <h1>Currency Converter</h1>
                <p>Convert currencies with updated exchange rates.</p>
            </div>

            <div class="input-group">
                <label for="amount">Amount</label>
                <input
                    type="number"
                    id="amount"
                    value="100"
                    min="0"
                    step="any"
                    placeholder="Enter amount"
                >
            </div>

            <div class="currency-section">
                <div class="currency-box">
                    <label for="fromCurrency">From</label>
                    <select id="fromCurrency">
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="NZD">NZD - New Zealand Dollar</option>
                        <option value="KRW">KRW - South Korean Won</option>
                        <option value="THB">THB - Thai Baht</option>
                        <option value="ZAR">ZAR - South African Rand</option>
                    </select>
                </div>

                <button id="swapBtn" class="swap-btn" title="Swap currencies">
                    ⇄
                </button>

                <div class="currency-box">
                    <label for="toCurrency">To</label>
                    <select id="toCurrency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="SGD">SGD - Singapore Dollar</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="NZD">NZD - New Zealand Dollar</option>
                        <option value="KRW">KRW - South Korean Won</option>
                        <option value="THB">THB - Thai Baht</option>
                        <option value="ZAR">ZAR - South African Rand</option>
                    </select>
                </div>
            </div>

            <button id="convertBtn" class="convert-btn">
                Convert Currency →
            </button>

            <div class="result-box">
                <p class="result-label">Converted Amount</p>
                <h2 id="result">--</h2>
                <p id="rateInfo">Your result will appear here.</p>
            </div>

            <p id="status" class="status" aria-live="polite"></p>

            <div class="footer-note">
                <span>🌐</span>
                Exchange rates powered by Frankfurter API
            </div>
        </main>

        <footer>
            Designed with ❤️ by Kavya | SpireX Foundation
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
